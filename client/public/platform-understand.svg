<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>A highlighter scanning raw conversation text and lifting out structured facts</title>
  <desc>A translucent scan bar sweeps down a panel of unstructured text lines, causing key phrases to highlight in coral, while corresponding structured tags for owner, deadline, and topic fade in on a panel to the right.</desc>
  <style>
    .scanbar { animation: sweep 5s ease-in-out infinite alternate; transform-box: fill-box; }
    @keyframes sweep { 0% { transform: translateY(0); } 100% { transform: translateY(196px); } }
    .hl { fill: #D85A30; transform-box: fill-box; transform-origin: left; }
    .hl1 { animation: glow 5s ease-in-out infinite; }
    .hl2 { animation: glow 5s ease-in-out infinite .9s; }
    .hl3 { animation: glow 5s ease-in-out infinite 1.8s; }
    @keyframes glow { 0%,15%,100% { opacity: .18; } 30%,55% { opacity: 1; } }
    .tag { transform-box: fill-box; transform-origin: left center; }
    .tag-in { animation: rise 5s ease-in-out infinite; }
    .tag1 { animation-delay: .3s; }
    .tag2 { animation-delay: 1.2s; }
    .tag3 { animation-delay: 2.1s; }
    @keyframes rise { 0%,10% { opacity: 0; transform: translateY(8px); } 25%,90% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); } }
    .label { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #4A1B0C; }
    .tag-text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #4A1B0C; font-weight: 600; }
    .tag-sub { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #993C1D; }
  </style>

  <rect x="0" y="0" width="640" height="480" rx="24" fill="#FBEAE3"/>
  <text class="label" x="320" y="70" text-anchor="middle" font-weight="600">Lifting facts out of the noise</text>

  <rect x="90" y="105" width="220" height="270" rx="16" fill="#ffffff" stroke="#F0997B" stroke-width="1"/>

  <g clip-path="none">
    <rect x="115" y="130" width="140" height="10" rx="5" fill="#EAD9CC"/>
    <rect x="115" y="155" width="170" height="10" rx="5" fill="#EAD9CC"/>
    <rect x="115" y="180" width="90" height="10" rx="5" fill="#EAD9CC"/>
    <rect class="hl hl1" x="205" y="180" width="60" height="10" rx="5"/>
    <rect x="115" y="205" width="160" height="10" rx="5" fill="#EAD9CC"/>
    <rect x="115" y="230" width="120" height="10" rx="5" fill="#EAD9CC"/>
    <rect class="hl hl2" x="115" y="255" width="70" height="10" rx="5"/>
    <rect x="195" y="255" width="80" height="10" rx="5" fill="#EAD9CC"/>
    <rect x="115" y="280" width="150" height="10" rx="5" fill="#EAD9CC"/>
    <rect x="115" y="305" width="100" height="10" rx="5" fill="#EAD9CC"/>
    <rect class="hl hl3" x="225" y="305" width="50" height="10" rx="5"/>
    <rect x="115" y="330" width="130" height="10" rx="5" fill="#EAD9CC"/>
  </g>

  <rect class="scanbar" x="98" y="122" width="204" height="34" rx="8" fill="#D85A30" opacity=".14"/>
  <rect class="scanbar" x="98" y="122" width="204" height="2" fill="#D85A30" opacity=".7"/>

  <path fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 6" opacity=".5" d="M312 240 C 345 240, 345 240, 378 240"/>

  <rect x="378" y="150" width="180" height="190" rx="16" fill="#ffffff" stroke="#F0997B" stroke-width="1"/>

  <g class="tag tag-in tag1">
    <rect x="398" y="175" width="140" height="34" rx="17" fill="#FAECE7"/>
    <circle cx="416" cy="192" r="4" fill="#D85A30"/>
    <text class="tag-text" x="428" y="188">Owner</text>
    <text class="tag-sub" x="428" y="202">Sarah</text>
  </g>

  <g class="tag tag-in tag2">
    <rect x="398" y="220" width="140" height="34" rx="17" fill="#FAECE7"/>
    <circle cx="416" cy="237" r="4" fill="#D85A30"/>
    <text class="tag-text" x="428" y="233">Deadline</text>
    <text class="tag-sub" x="428" y="247">Friday</text>
  </g>

  <g class="tag tag-in tag3">
    <rect x="398" y="265" width="140" height="34" rx="17" fill="#FAECE7"/>
    <circle cx="416" cy="282" r="4" fill="#D85A30"/>
    <text class="tag-text" x="428" y="278">Topic</text>
    <text class="tag-sub" x="428" y="292">Budget</text>
  </g>

  <rect x="120" y="410" width="400" height="34" rx="17" fill="#ffffff"/>
  <text x="320" y="431" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#7A5647" text-anchor="middle">Clawvio reads context, not just words</text>
</svg>

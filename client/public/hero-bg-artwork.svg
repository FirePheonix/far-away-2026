<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Warm radiant energy converging toward a bright focal point, representing conversation becoming execution</title>
  <desc>Layered coral and amber blobs, radiating concentric arcs, and drifting particles on a deep warm gradient background.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A1B0C"/>
      <stop offset="45%" stop-color="#8C3A1D"/>
      <stop offset="75%" stop-color="#C6501F"/>
      <stop offset="100%" stop-color="#6E260F"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCDE5A" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F2A623" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#D85A30" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D85A30" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0997B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0997B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCDE5A" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FCDE5A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF6E6" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <style>
      .arc { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
      .a1 { animation-delay: 0s; }
      .a2 { animation-delay: .9s; }
      .a3 { animation-delay: 1.8s; }
      .a4 { animation-delay: 2.7s; }
      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 0; }
        15% { opacity: .55; }
        70% { opacity: .12; }
        100% { transform: scale(1.15); opacity: 0; }
      }
      .drift { animation: drift 10s ease-in-out infinite alternate; }
      @keyframes drift { 0% { transform: translate(0,0); } 100% { transform: translate(18px,-14px); } }
      .twinkle { animation: tw 3.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <ellipse cx="560" cy="820" filter="url(#soft)" rx="520" ry="360" fill="#F0997B" opacity="0.35"/>
  <ellipse cx="1500" cy="860" filter="url(#soft)" rx="480" ry="340" fill="#993C1D" opacity="0.5"/>
  <ellipse cx="1250" cy="180" filter="url(#soft)" rx="600" ry="300" fill="#F2A623" opacity="0.4"/>
  <ellipse cx="300" cy="150" filter="url(#soft)" rx="380" ry="260" fill="#D85A30" opacity="0.4"/>

  <g class="drift">
    <ellipse cx="1400" cy="300" filter="url(#soft2)" rx="260" ry="180" fill="#FCDE5A" opacity="0.28"/>
  </g>

  <circle cx="1400" cy="300" r="480" fill="url(#glow)"/>
  <circle cx="700" cy="700" r="380" fill="url(#glow2)"/>

  <g fill="none" stroke="#FFF6E6" stroke-width="2">
    <circle class="arc a1" cx="1400" cy="300" r="140"/>
    <circle class="arc a2" cx="1400" cy="300" r="140"/>
    <circle class="arc a3" cx="1400" cy="300" r="140"/>
    <circle class="arc a4" cx="1400" cy="300" r="140"/>
  </g>

  <path d="M 60 980 C 500 760, 900 640, 1860 140" stroke="url(#ribbon)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 20 1040 C 460 840, 880 700, 1900 220" stroke="url(#ribbon)" stroke-width="1.5" fill="none" opacity="0.5"/>

  <g fill="#FFF6E6">
    <circle class="twinkle" cx="1660" cy="180" r="3"/>
    <circle class="twinkle" cx="1740" cy="260" r="2" style="animation-delay:.6s"/>
    <circle class="twinkle" cx="1560" cy="120" r="2.5" style="animation-delay:1.2s"/>
    <circle class="twinkle" cx="1230" cy="90" r="2" style="animation-delay:1.8s"/>
    <circle class="twinkle" cx="980" cy="360" r="2.5" style="animation-delay:.3s"/>
    <circle class="twinkle" cx="1120" cy="480" r="2" style="animation-delay:2.1s"/>
    <circle class="twinkle" cx="360" cy="540" r="2.5" style="animation-delay:1.5s"/>
    <circle class="twinkle" cx="240" cy="380" r="2" style="animation-delay:.9s"/>
    <circle class="twinkle" cx="1780" cy="620" r="2" style="animation-delay:2.4s"/>
    <circle class="twinkle" cx="1620" cy="740" r="3" style="animation-delay:.2s"/>
    <circle class="twinkle" cx="140" cy="820" r="2" style="animation-delay:1.1s"/>
    <circle class="twinkle" cx="820" cy="920" r="2.5" style="animation-delay:1.7s"/>
  </g>

  <rect width="1920" height="1080" fill="#2C0D04" opacity="0.14"/>
  <rect x="0" y="620" width="1920" height="460" fill="#2C0D04" opacity="0.22"/>
</svg>

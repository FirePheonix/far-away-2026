<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>A knowledge graph of nodes growing and connecting over time</title>
  <desc>Six nodes appear in sequence with connecting lines fading in between them, showing Clawvio's memory compounding as more work runs through it.</desc>
  <style>
    .n1 { animation: appear .5s ease-out .1s both; }
    .n2 { animation: appear .5s ease-out .5s both; }
    .n3 { animation: appear .5s ease-out .9s both; }
    .n4 { animation: appear .5s ease-out 1.3s both; }
    .n5 { animation: appear .5s ease-out 1.7s both; }
    @keyframes appear { 0% { opacity:0; } 100% { opacity:1; } }
    .l1 { animation: linein .4s ease-out .4s both; }
    .l2 { animation: linein .4s ease-out .8s both; }
    .l3 { animation: linein .4s ease-out 1.2s both; }
    .l4 { animation: linein .4s ease-out 1.6s both; }
    .l5 { animation: linein .4s ease-out 2s both; }
    @keyframes linein { 0% { opacity:0; } 100% { opacity:.55; } }
    .node-bg { fill: #ffffff; stroke: #F0997B; stroke-width: 1; }
    .label { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #7A5647; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="640" height="480" rx="24" fill="#FBEAE3"/>
  <text class="label" x="320" y="75" font-weight="600" fill="#4A1B0C" font-size="15">Memory that compounds</text>

  <line class="l1" x1="270" y1="250" x2="380" y2="180" stroke="#D85A30" stroke-width="1.5"/>
  <line class="l2" x1="270" y1="250" x2="200" y2="170" stroke="#D85A30" stroke-width="1.5"/>
  <line class="l3" x1="380" y1="180" x2="470" y2="220" stroke="#D85A30" stroke-width="1.5"/>
  <line class="l4" x1="270" y1="250" x2="310" y2="340" stroke="#D85A30" stroke-width="1.5"/>
  <line class="l5" x1="470" y1="220" x2="500" y2="320" stroke="#D85A30" stroke-width="1.5"/>

  <circle class="n1" cx="270" cy="250" r="30" fill="#D85A30"/>
  <text class="n1" x="270" y="254" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Run 1</text>

  <circle class="node-bg n2" cx="200" cy="170" r="18"/>
  <circle class="node-bg n3" cx="380" cy="180" r="20"/>
  <circle class="node-bg n4" cx="470" cy="220" r="20"/>
  <circle class="node-bg n5" cx="310" cy="340" r="18"/>
  <circle class="node-bg n5" cx="500" cy="320" r="18"/>

  <rect x="120" y="410" width="400" height="34" rx="17" fill="#ffffff"/>
  <text class="label" x="320" y="431">Every run adds to a searchable, reusable memory</text>
</svg>

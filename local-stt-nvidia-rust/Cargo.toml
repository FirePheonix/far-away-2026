[package]
name = "local-stt-rs"
version = "0.1.0"
edition = "2021"
description = "Background speech-to-text tray app powered by NVIDIA Parakeet TDT (sherpa-onnx)"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
bzip2 = "0.5"
cpal = "0.15"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
env_logger = "0.11"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
muda = "0.15"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared libs avoid MSVC /MT vs /MD link conflicts on Windows static builds.
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
tar = "0.4"
tray-icon = "0.19"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
